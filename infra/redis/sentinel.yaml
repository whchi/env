    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s


  redis-sentinel-3:
    image: redis:8-alpine
    restart: unless-stopped

    ports:
      - "26381:26379"

    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy

    command:
      - sh
      - -c
      - |-
        if [ ! -f /data/sentinel.conf ]; then
          cat > /data/sentinel.conf <<EOF
        bind 0.0.0.0
        protected-mode no
        port 26379
        dir /data

        sentinel monitor mymaster ${VM_IP} 6379 2
